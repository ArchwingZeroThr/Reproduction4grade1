# SimDiff constructor defaults centralized from the upstream README command.
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_act: gelu
initializer_range: 0.02
layer_norm_eps: 1e-12
attn_dropout_prob: 0.2
hidden_dropout_prob: 0.2
loss_type: CE
neg_sampling: ~

mask_strategy: sample
mask_ratio: 0.2
encoder_loss_weight: 1
contrastive_loss_weight: 0.001
generate_loss_weight: 0.2
n_embedding: 2
n_sampling: 5

# Local execution-patch switches. These defaults retain the author snapshot's
# semantic-neighbour noise and confidence-based position selection.
noise_mode: semantic
position_mode: confidence

# The imported snapshot reads these values while constructing its shared
# SASRecP/BERT4Rec modules. Null values preserve the previous effective values
# for currently unused paths; ignore_pad=False preserves its former falsy value.
generate_method: ~
ignore_pad: False
contras_loss_temp: ~
contras_target: ~
contras_k: ~
